[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-lang"
version = "0.1.0"
description = "Kite — a tiny programming language that compiles to Flutter for real iOS & Android apps"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tanimowo Obaloluwa" }]
requires-python = ">=3.8"
keywords = ["language", "compiler", "transpiler", "flutter", "mobile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
kite = "kite.__main__:main"

[project.urls]
Homepage = "https://github.com/TanimowoObaloluwaDavid/kite"

[tool.setuptools]
packages = ["kite"]
